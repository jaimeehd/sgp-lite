name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.8"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    defaults:
      run:
        working-directory: kit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Pruebas del kit
        run: python -m unittest discover -s tools -p "test_*.py" -v

  ejemplo:
    name: ejemplo descuento · sgp_check --run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verificador sobre el ejemplo
        run: python kit/tools/sgp_check.py --root examples/descuento --run

  guardas:
    name: guardas de repo · enlaces y frescura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enlaces y anclas rotas
        run: python kit/tools/sgp_links.py --strict
      - name: Frescura de la documentación
        run: python kit/tools/sgp_fresh.py --max-days 180 --require README.md --strict
