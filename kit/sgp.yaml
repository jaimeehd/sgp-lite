# Configuración mínima. El verificador (tools/sgp_check.py) lee estos valores.
# Subconjunto soportado por el verificador: secciones `clave:` y dentro pares `clave: valor`.
# No hay listas YAML ni anidamiento: las líneas que no son `clave: valor` se ignoran.
# Un `#` precedido de espacio inicia un comentario, salvo dentro de comillas.
# Ver tools/sgp_check.py (read_config).
limites:
  max_iteraciones_por_tarea: 5
  max_lineas_constitucion: 20
rutas:
  specs: specs
  cambios: changes
  tests: tests
# Ratchet real (tools/sgp_check.py --ratchet): rutas de pruebas vigiladas, relativas a la raíz
# y con `/` (varias por coma), con comodín (p. ej. `ratchet: tests, kit/tools/test_*.py`). Sin
# esta clave vigila `tests:` por compatibilidad. Si ninguna ruta existe, el ratchet AVISA (nunca
# un verde silencioso) y el sello del commit-msg deja constancia en el mensaje.
# ratchet: tests
# Puerta de revisión (tools/sgp_review.py): claves opcionales con estos mismos
# valores por defecto. Sin `log_proceso` apuntando a un archivo existente, la
# puerta avisa que está inactiva y no exige la ronda de revisión.
# revision:
#   log_proceso: docs/LOG-PROCESO.md   # registro de rondas de revisión (fila: | fecha | # | tipo | qué | estado | referencia |)
#   corte_fuente: 2026-10-23           # desde esta fecha, toda fila exige citar `subagente <id>`
#   subagentes: senior-reviewer, independent-verifier, docs-syncer
comandos:                    # vacío = sensor sin configurar (error en pre-merge)
  build: ""                  # ej.: dotnet build -c Release | npm run build
  tests: ""                  # ej.: dotnet test | python -m pytest -q
  lint: ""                   # ej.: ruff check . | npx astro check
  test_por_requisito: ""     # ejecuta SOLO las pruebas de un requisito. Marcadores: {id} = EXP-001, {id_py} = EXP_001
                             # ej.: python -m pytest -q -k {id_py}   |   python -m unittest discover -s tests -k {id_py}
